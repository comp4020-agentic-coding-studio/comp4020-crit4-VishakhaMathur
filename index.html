<!doctype html>
<html lang="en-AU">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>The Friction Pad</title>
    <meta
      name="description"
      content="The Friction Pad: a full-screen instrument you draw with light --- drag a finger, stylus, or mouse to leave a colourful, fading trail."
    />

    <!--
      The link-preview card: public/card.png, 1200x630 --- replace it. The URL
      resolves against this page, like any link. No og:title/og:description:
      scrapers fall back to the <title> and description above.
    -->
    <meta property="og:type" content="website" />
    <meta property="og:image" content="./card.png" />
    <meta name="twitter:card" content="summary_large_image" />

    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <header>
      <nav aria-label="Primary">
        <a href="./">Home</a>
      </nav>
    </header>
    <main>
      <h1>The Friction Pad</h1>
      <canvas
        id="pad"
        data-testid="pad"
        aria-label="Drawing surface --- drag, or steer with arrow keys or WASD, to draw and play"
      ></canvas>
      <div id="overlay" class="overlay">
        <div class="pulse" aria-hidden="true"></div>
        <p>Click, touch, or press any key to play</p>
      </div>
    </main>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
